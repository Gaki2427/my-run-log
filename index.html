<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>My Run Log</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="RunLog" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --border: #334155;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom));
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }
    .container { max-width: 640px; margin: 0 auto; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0 12px;
    }
    h1 { margin: 0; font-size: 1.3rem; letter-spacing: 0.02em; }
    button {
      background: var(--accent);
      color: #0f172a;
      border: none;
      border-radius: 10px;
      padding: 8px 14px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      touch-action: manipulation;
    }
    button.secondary {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
    }
    button:disabled { opacity: 0.35; cursor: not-allowed; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }
    .month-nav {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 4px;
    }
    .month-nav button {
      background: transparent;
      color: var(--text);
      border: none;
      padding: 6px 14px;
      font-size: 1rem;
      border-radius: 8px;
    }
    .month-label {
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 0.03em;
      cursor: pointer;
    }
    input[type="password"], input[type="text"] {
      background: #0f172a;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 0.95rem;
    }
    .key-row { display: flex; gap: 8px; margin-top: 8px; }
    .key-row input { flex: 1; min-width: 0; }
    .hint { font-size: 0.8rem; color: var(--muted); margin: 6px 0 0; }
    .status {
      font-size: 0.85rem;
      color: var(--accent);
      margin-bottom: 10px;
      min-height: 1.2em;
    }
    .status.error { color: #f87171; }
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }
    .stat {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
    }
    .stat-label { font-size: 0.75rem; color: var(--muted); }
    .stat-value { font-size: 1.35rem; font-weight: 700; margin-top: 2px; }
    .chart-wrap { position: relative; height: 220px; }
    .run-item {
      border-top: 1px solid var(--border);
      padding: 12px 0;
    }
    .run-item:first-child { border-top: none; padding-top: 4px; }
    .run-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
    }
    .run-date { font-size: 0.82rem; color: var(--muted); }
    .run-title { font-weight: 600; font-size: 0.95rem; margin: 2px 0 6px; }
    .run-metrics {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.85rem;
      color: #cbd5e1;
    }
    .badge {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 3px 8px;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>My Run Log</h1>
      <button id="toggleSettingsBtn" class="secondary">設定</button>
    </header>

    <!-- APIキー設定パネル -->
    <section id="settingsPanel" class="card hidden">
      <div style="font-weight: 700; font-size: 0.95rem;">Intervals.icu APIキー設定</div>
      <div class="key-row">
        <input id="apiKeyInput" type="password" placeholder="APIキーを貼り付け" autocomplete="off" />
        <button id="saveKeyBtn">保存</button>
      </div>
      <p class="hint">※キーはこの端末内（localStorage）だけに保存され、外部には送信されません。</p>
    </section>

    <!-- 月切り替え & 同期 -->
    <div class="controls">
      <div class="month-nav">
        <button id="prevMonthBtn" aria-label="前の月">◀</button>
        <span id="monthLabel" class="month-label" title="タップで今月に戻る">----年--月</span>
        <button id="nextMonthBtn" aria-label="次の月">▶</button>
      </div>
      <button id="syncBtn">同期</button>
    </div>

    <div id="status" class="status"></div>

    <!-- サマリー -->
    <section class="summary-grid">
      <div class="stat">
        <div class="stat-label">月間走行距離</div>
        <div id="statDistance" class="stat-value">- km</div>
      </div>
      <div class="stat">
        <div class="stat-label">ラン回数</div>
        <div id="statCount" class="stat-value">- 回</div>
      </div>
      <div class="stat">
        <div class="stat-label">平均ペース</div>
        <div id="statPace" class="stat-value">- /km</div>
      </div>
      <div class="stat">
        <div class="stat-label">平均ピッチ</div>
        <div id="statCadence" class="stat-value">- spm</div>
      </div>
    </section>

    <!-- グラフ -->
    <section class="card">
      <div id="chartTitle" style="font-weight: 700; font-size: 0.95rem; margin-bottom: 8px;">日別走行距離 (km)</div>
      <div class="chart-wrap">
        <canvas id="distanceChart"></canvas>
      </div>
    </section>

    <!-- ログ一覧 -->
    <section class="card">
      <div style="font-weight: 700; font-size: 0.95rem; margin-bottom: 6px;">ランニング履歴</div>
      <div id="runList" class="hint">APIキーを設定して「同期」を押してください。</div>
    </section>
  </div>

  <script>
    const KEY_STORAGE = 'intervals_api_key';
    const CACHE_PREFIX = 'intervals_runs_month_';
    const WEEKDAYS = ['日', '月', '火', '水', '木', '金', '土'];

    const today = new Date();
    let currentYear = today.getFullYear();
    let currentMonth = today.getMonth() + 1; // 1〜12
    let chartInstance = null;
    let activeRequestId = 0;

    const el = {
      settingsPanel: document.getElementById('settingsPanel'),
      toggleSettingsBtn: document.getElementById('toggleSettingsBtn'),
      apiKeyInput: document.getElementById('apiKeyInput'),
      saveKeyBtn: document.getElementById('saveKeyBtn'),
      prevMonthBtn: document.getElementById('prevMonthBtn'),
      nextMonthBtn: document.getElementById('nextMonthBtn'),
      monthLabel: document.getElementById('monthLabel'),
      syncBtn: document.getElementById('syncBtn'),
      status: document.getElementById('status'),
      statDistance: document.getElementById('statDistance'),
      statCount: document.getElementById('statCount'),
      statPace: document.getElementById('statPace'),
      statCadence: document.getElementById('statCadence'),
      chartTitle: document.getElementById('chartTitle'),
      runList: document.getElementById('runList')
    };

    function getYmKey(year, month) {
      return `${year}-${String(month).padStart(2, '0')}`;
    }

    function getDaysInMonth(year, month) {
      return new Date(year, month, 0).getDate();
    }

    function isCurrentMonth(year, month) {
      const now = new Date();
      return year === now.getFullYear() && month === now.getMonth() + 1;
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, s => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[s]));
    }

    function formatPace(secPerKm) {
      if (!secPerKm || !isFinite(secPerKm)) return '-';
      const min = Math.floor(secPerKm / 60);
      const sec = Math.round(secPerKm % 60);
      if (sec === 60) return `${min + 1}'00"`;
      return `${min}'${String(sec).padStart(2, '0')}"`;
    }

    function formatDuration(totalSec) {
      if (!totalSec) return '-';
      const h = Math.floor(totalSec / 3600);
      const m = Math.floor((totalSec % 3600) / 60);
      const s = Math.round(totalSec % 60);
      if (h > 0) return `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      return `${m}:${String(s).padStart(2, '0')}`;
    }

    function formatRunDate(isoLocal) {
      if (!isoLocal) return '-';
      const [datePart, timePart] = isoLocal.split('T');
      const [y, m, d] = datePart.split('-').map(Number);
      const dow = WEEKDAYS[new Date(y, m - 1, d).getDay()];
      const hm = timePart ? timePart.slice(0, 5) : '';
      return `${m}/${d} (${dow}) ${hm}`;
    }

    function normalizeCadence(raw) {
      if (!raw || raw <= 0) return null;
      return Math.round(raw < 120 ? raw * 2 : raw);
    }

    function setStatus(msg, isError = false) {
      el.status.textContent = msg;
      el.status.className = isError ? 'status error' : 'status';
    }

    function updateMonthHeader() {
      el.monthLabel.textContent = `${currentYear}年${currentMonth}月`;
      el.nextMonthBtn.disabled = isCurrentMonth(currentYear, currentMonth);
    }

    function loadCache(ym) {
      const raw = localStorage.getItem(CACHE_PREFIX + ym);
      if (!raw) return null;
      try {
        return JSON.parse(raw);
      } catch {
        return null;
      }
    }

    function saveCache(ym, runs) {
      localStorage.setItem(CACHE_PREFIX + ym, JSON.stringify({
        runs,
        updatedAt: new Date().toLocaleTimeString('ja-JP')
      }));
    }

    async function fetchMonthRuns(year, month) {
      const apiKey = localStorage.getItem(KEY_STORAGE);
      if (!apiKey) {
        el.settingsPanel.classList.remove('hidden');
        setStatus('まずIntervals.icuのAPIキーを設定してください。', true);
        return;
      }

      const ym = getYmKey(year, month);
      const lastDay = getDaysInMonth(year, month);
      const oldest = `${ym}-01`;
      const newest = `${ym}-${String(lastDay).padStart(2, '0')}`;
      const url = `https://intervals.icu/api/v1/athlete/0/activities?oldest=${oldest}&newest=${newest}`;

      const reqId = ++activeRequestId;
      el.syncBtn.disabled = true;
      setStatus(`${year}年${month}月を同期中...`);

      try {
        const res = await fetch(url, {
          headers: { 'Authorization': 'Basic ' + btoa(`API_KEY:${apiKey}`) }
        });

        if (res.status === 401 || res.status === 403) {
          throw new Error('認証エラー：APIキーが正しいか確認してください。');
        }
        if (!res.ok) {
          throw new Error(`取得に失敗しました (HTTP ${res.status})`);
        }

        const data = await res.json();
        const runs = data
          .filter(a => a.type && a.type.toLowerCase().includes('run') && (a.start_date_local || '').startsWith(ym))
          .sort((a, b) => (b.start_date_local || '').localeCompare(a.start_date_local || ''));

        saveCache(ym, runs);

        // 連打して別月に移っていた場合は古い結果を上書きしない
        if (reqId !== activeRequestId) return;

        render(runs, year, month);
        setStatus(`同期完了（${runs.length}件・${new Date().toLocaleTimeString('ja-JP')}）`);
      } catch (err) {
        if (reqId !== activeRequestId) return;
        setStatus(err.message, true);
      } finally {
        if (reqId === activeRequestId) {
          el.syncBtn.disabled = false;
        }
      }
    }

    function showMonth(forceFetch = false) {
      updateMonthHeader();
      const ym = getYmKey(currentYear, currentMonth);
      const cached = loadCache(ym);

      if (cached) {
        render(cached.runs || [], currentYear, currentMonth);
        setStatus(`キャッシュ表示（最終同期 ${cached.updatedAt}）`);
      } else {
        render([], currentYear, currentMonth);
      }

      const hasKey = Boolean(localStorage.getItem(KEY_STORAGE));
      if (hasKey && (forceFetch || !cached || isCurrentMonth(currentYear, currentMonth))) {
        fetchMonthRuns(currentYear, currentMonth);
      }
    }

    function render(runs, year, month) {
      const totalMeters = runs.reduce((sum, r) => sum + (r.distance || 0), 0);
      const totalSec = runs.reduce((sum, r) => sum + (r.moving_time || 0), 0);
      const totalKm = totalMeters / 1000;

      const cadences = runs.map(r => normalizeCadence(r.average_cadence)).filter(Boolean);
      const avgCadence = cadences.length
        ? Math.round(cadences.reduce((a, b) => a + b, 0) / cadences.length)
        : null;

      el.statDistance.textContent = `${totalKm.toFixed(1)} km`;
      el.statCount.textContent = `${runs.length} 回`;
      el.statPace.textContent = totalKm > 0 ? `${formatPace(totalSec / totalKm)} /km` : '- /km';
      el.statCadence.textContent = avgCadence ? `${avgCadence} spm` : '- spm';

      renderChart(runs, year, month);
      renderList(runs, year, month);
