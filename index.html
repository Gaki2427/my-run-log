<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>My Run Log</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="RunLog" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --border: #334155;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom));
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }
    .container { max-width: 640px; margin: 0 auto; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0 12px;
    }
    h1 { margin: 0; font-size: 1.3rem; letter-spacing: 0.02em; }
    button {
      background: var(--accent);
      color: #0f172a;
      border: none;
      border-radius: 10px;
      padding: 8px 14px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
    }
    button.secondary {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .controls {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }
    select, input[type="password"], input[type="text"] {
      background: #0f172a;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 0.95rem;
    }
    select { flex: 1; }
    .key-row { display: flex; gap: 8px; margin-top: 8px; }
    .key-row input { flex: 1; min-width: 0; }
    .hint { font-size: 0.8rem; color: var(--muted); margin: 6px 0 0; }
    .status {
      font-size: 0.85rem;
      color: var(--accent);
      margin-bottom: 10px;
      min-height: 1.2em;
    }
    .status.error { color: #f87171; }
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }
    .stat {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
    }
    .stat-label { font-size: 0.75rem; color: var(--muted); }
    .stat-value { font-size: 1.35rem; font-weight: 700; margin-top: 2px; }
    .chart-wrap { position: relative; height: 220px; }
    .run-item {
      border-top: 1px solid var(--border);
      padding: 12px 0;
    }
    .run-item:first-child { border-top: none; padding-top: 4px; }
    .run-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
    }
    .run-date { font-size: 0.8rem; color: var(--muted); }
    .run-title { font-weight: 600; font-size: 0.95rem; margin: 2px 0 6px; }
    .run-metrics {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 0.85rem;
      color: #cbd5e1;
    }
    .badge {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 3px 8px;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>My Run Log</h1>
      <button id="toggleSettingsBtn" class="secondary">設定</button>
    </header>

    <!-- APIキー設定パネル -->
    <section id="settingsPanel" class="card hidden">
      <div style="font-weight: 700; font-size: 0.95rem;">Intervals.icu APIキー設定</div>
      <div class="key-row">
        <input id="apiKeyInput" type="password" placeholder="APIキーを貼り付け" autocomplete="off" />
        <button id="saveKeyBtn">保存</button>
      </div>
      <p class="hint">※キーはこの端末内（localStorage）だけに保存され、外部には送信されません。</p>
    </section>

    <!-- 期間選択 & 同期 -->
    <div class="controls">
      <select id="rangeSelect">
        <option value="30">直近30日（ラン別）</option>
        <option value="90" selected>直近90日（月別）</option>
        <option value="365">直近1年（月別）</option>
      </select>
      <button id="syncBtn">同期</button>
    </div>

    <div id="status" class="status"></div>

    <!-- サマリー -->
    <section class="summary-grid">
      <div class="stat">
        <div class="stat-label">総距離</div>
        <div id="statDistance" class="stat-value">- km</div>
      </div>
      <div class="stat">
        <div class="stat-label">ラン回数</div>
        <div id="statCount" class="stat-value">- 回</div>
      </div>
      <div class="stat">
        <div class="stat-label">平均ペース</div>
        <div id="statPace" class="stat-value">- /km</div>
      </div>
      <div class="stat">
        <div class="stat-label">平均ピッチ</div>
        <div id="statCadence" class="stat-value">- spm</div>
      </div>
    </section>

    <!-- グラフ -->
    <section class="card">
      <div id="chartTitle" style="font-weight: 700; font-size: 0.95rem; margin-bottom: 8px;">月別走行距離 (km)</div>
      <div class="chart-wrap">
        <canvas id="distanceChart"></canvas>
      </div>
    </section>

    <!-- ログ一覧 -->
    <section class="card">
      <div style="font-weight: 700; font-size: 0.95rem; margin-bottom: 6px;">ランニング履歴</div>
      <div id="runList" class="hint">APIキーを設定して「同期」を押してください。</div>
    </section>
  </div>

  <script>
    const KEY_STORAGE = 'intervals_api_key';
    const CACHE_STORAGE = 'intervals_runs_cache';
    let chartInstance = null;

    const el = {
      settingsPanel: document.getElementById('settingsPanel'),
      toggleSettingsBtn: document.getElementById('toggleSettingsBtn'),
      apiKeyInput: document.getElementById('apiKeyInput'),
      saveKeyBtn: document.getElementById('saveKeyBtn'),
      rangeSelect: document.getElementById('rangeSelect'),
      syncBtn: document.getElementById('syncBtn'),
      status: document.getElementById('status'),
      statDistance: document.getElementById('statDistance'),
      statCount: document.getElementById('statCount'),
      statPace: document.getElementById('statPace'),
      statCadence: document.getElementById('statCadence'),
      chartTitle: document.getElementById('chartTitle'),
      runList: document.getElementById('runList')
    };

    function formatDate(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function formatPace(secPerKm) {
      if (!secPerKm || !isFinite(secPerKm)) return '-';
      const min = Math.floor(secPerKm / 60);
      const sec = Math.round(secPerKm % 60);
      if (sec === 60) return `${min + 1}'00"`;
      return `${min}'${String(sec).padStart(2, '0')}"`;
    }

    function formatDuration(totalSec) {
      if (!totalSec) return '-';
      const h = Math.floor(totalSec / 3600);
      const m = Math.floor((totalSec % 3600) / 60);
      const s = Math.round(totalSec % 60);
      if (h > 0) return `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      return `${m}:${String(s).padStart(2, '0')}`;
    }

    function normalizeCadence(raw) {
      if (!raw || raw <= 0) return null;
      // 片足カウント(80-95前後)で返る場合は2倍してspmに揃える
      return Math.round(raw < 120 ? raw * 2 : raw);
    }

    function setStatus(msg, isError = false) {
      el.status.textContent = msg;
      el.status.className = isError ? 'status error' : 'status';
    }

    async function fetchRuns() {
      const apiKey = localStorage.getItem(KEY_STORAGE);
      if (!apiKey) {
        el.settingsPanel.classList.remove('hidden');
        setStatus('まずIntervals.icuのAPIキーを設定してください。', true);
        return;
      }

      const days = Number(el.rangeSelect.value);
      const newest = new Date();
      const oldest = new Date();
      oldest.setDate(newest.getDate() - days);

      const url = `https://intervals.icu/api/v1/athlete/0/activities?oldest=${formatDate(oldest)}&newest=${formatDate(newest)}`;

      el.syncBtn.disabled = true;
      setStatus('同期中...');

      try {
        const res = await fetch(url, {
          headers: { 'Authorization': 'Basic ' + btoa(`API_KEY:${apiKey}`) }
        });

        if (res.status === 401 || res.status === 403) {
          throw new Error('認証エラー：APIキーが正しいか確認してください。');
        }
        if (!res.ok) {
          throw new Error(`取得に失敗しました (HTTP ${res.status})`);
        }

        const data = await res.json();
        const runs = data
          .filter(a => a.type && a.type.toLowerCase().includes('run'))
          .sort((a, b) => (b.start_date_local || '').localeCompare(a.start_date_local || ''));

        localStorage.setItem(CACHE_STORAGE, JSON.stringify({ days, runs, updatedAt: new Date().toLocaleTimeString('ja-JP') }));
        render(runs, days);
        setStatus(`同期完了（${runs.length}件・${new Date().toLocaleTimeString('ja-JP')}）`);
      } catch (err) {
        setStatus(err.message, true);
      } finally {
        el.syncBtn.disabled = false;
      }
    }

    function render(runs, days) {
      const totalMeters = runs.reduce((sum, r) => sum + (r.distance || 0), 0);
      const totalSec = runs.reduce((sum, r) => sum + (r.moving_time || 0), 0);
      const totalKm = totalMeters / 1000;

      const cadences = runs.map(r => normalizeCadence(r.average_cadence)).filter(Boolean);
      const avgCadence = cadences.length
        ? Math.round(cadences.reduce((a, b) => a + b, 0) / cadences.length)
        : null;

      el.statDistance.textContent = `${totalKm.toFixed(1)} km`;
      el.statCount.textContent = `${runs.length} 回`;
      el.statPace.textContent = totalKm > 0 ? `${formatPace(totalSec / totalKm)} /km` : '- /km';
      el.statCadence.textContent = avgCadence ? `${avgCadence} spm` : '- spm';

      renderChart(runs, days);
      renderList(runs);
    }

    function renderChart(runs, days) {
      const ctx = document.getElementById('distanceChart').getContext('2d');
      if (chartInstance) chartInstance.destroy();

      let labels = [];
      let values = [];

      if (days <= 30) {
        el.chartTitle.textContent = 'ラン別距離 (km)';
        const ordered = [...runs].reverse();
        labels = ordered.map(r => (r.start_date_local || '').slice(5, 10));
        values = ordered.map(r => Number(((r.distance || 0) / 1000).toFixed(2)));
      } else {
        el.chartTitle.textContent = '月別走行距離 (km)';
        const byMonth = {};
        runs.forEach(r => {
          const ym = (r.start_date_local || '').slice(0, 7);
          if (!ym) return;
          byMonth[ym] = (byMonth[ym] || 0) + (r.distance || 0) / 1000;
        });
        labels = Object.keys(byMonth).sort();
        values = labels.map(k => Number(byMonth[k].toFixed(1)));
      }

      chartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels,
          datasets: [{
            label: '距離 (km)',
            data: values,
            backgroundColor: '#38bdf8',
            borderRadius: 6
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { color: '#94a3b8' }, grid: { display: false } },
            y: { beginAtZero: true, ticks: { color: '#94a3b8' }, grid: { color: '#334155' } }
          }
        }
      });
    }

    function renderList(runs) {
      if (!runs.length) {
        el.runList.innerHTML = '<div class="hint">この期間のランニングデータがありません。</div>';
        return;
      }

      el.runList.innerHTML = runs.map(r => {
        const km = ((r.distance || 0) / 1000);
        const pace = km > 0 ? formatPace((r.moving_time || 0) / km) : '-';
        const dateStr = (r.start_date_local || '').replace('T', ' ').slice(0, 16);
        const hr = r.average_heartrate ? `${Math.round(r.average_heartrate)} bpm` : null;
        const spm = normalizeCadence(r.average_cadence);
        const elev = r.total_elevation_gain ? `+${Math.round(r.total_elevation_gain)} m` : null;

        return `
          <div class="run-item">
            <div class="run-head">
              <span class="run-date">${dateStr}</span>
              <span style="font-weight:700; color:#38bdf8;">${km.toFixed(2)} km</span>
            </div>
            <div class="run-title">${r.name || 'Run'}</div>
            <div class="run-metrics">
              <span class="badge">時間 ${formatDuration(r.moving_time)}</span>
              <span class="badge">ペース ${pace}/km</span>
              ${hr ? `<span class="badge">心拍 ${hr}</span>` : ''}
              ${spm ? `<span class="badge">ピッチ ${spm} spm</span>` : ''}
              ${elev ? `<span class="badge">獲得標高 ${elev}</span>` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    // イベント登録
    el.toggleSettingsBtn.addEventListener('click', () => {
      el.settingsPanel.classList.toggle('hidden');
    });

    el.saveKeyBtn.addEventListener('click', () => {
      const key = el.apiKeyInput.value.trim();
      if (!key) return;
      localStorage.setItem(KEY_STORAGE, key);
      el.settingsPanel.classList.add('hidden');
      fetchRuns();
    });

    el.syncBtn.addEventListener('click', fetchRuns);
    el.rangeSelect.addEventListener('change', fetchRuns);

    // 初期起動
    (function init() {
      const savedKey = localStorage.getItem(KEY_STORAGE);
      if (savedKey) {
        el.apiKeyInput.value = savedKey;
      } else {
        el.settingsPanel.classList.remove('hidden');
      }

      const cached = localStorage.getItem(CACHE_STORAGE);
      if (cached) {
        try {
          const parsed = JSON.parse(cached);
          el.rangeSelect.value = String(parsed.days || 90);
          render(parsed.runs || [], parsed.days || 90);
        } catch {}
      }

      if (savedKey) fetchRuns();
    })();
  </script>
</body>
</html>
